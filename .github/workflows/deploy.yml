name: Deploy

on:
  push:
    tags:
      - "v1*"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bifrost
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: bifrost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bifrost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migrations
        run: PGPASSWORD=localdev psql -h localhost -U bifrost -d bifrost -f scripts/migrations/001_init.sql

      - name: Gateway tests
        working-directory: gateway
        run: go test ./... -v

      - name: Analytics tests
        working-directory: analytics
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests/ -v

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Build and push gateway
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/gateway:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/gateway:latest gateway/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/gateway

      - name: Build and push builder
        run: |
          cp -r proto builder/proto
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/builder:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/builder:latest builder/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/builder
          rm -rf builder/proto

      - name: Build and push validator
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/validator:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/validator:latest validator/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/validator

      - name: Build and push healthcheck
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/healthcheck:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/healthcheck:latest healthcheck/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/healthcheck

      - name: Build and push realtime
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/realtime:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/realtime:latest realtime/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/realtime

      - name: Build and push email worker
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/email:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/email:latest email/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/email

      - name: Build and push analytics
        run: |
          docker build -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/analytics:${{ github.ref_name }} \
                       -t europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/analytics:latest analytics/
          docker push --all-tags europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/analytics

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: bifrost-cluster
          location: europe-central2

      - name: Apply K8s manifests
        run: |
          kubectl apply -f rabbitmq/k8s/deployment.yaml
          kubectl apply -f rabbitmq/k8s/service.yaml
          kubectl apply -f gateway/k8s/sa.yaml
          kubectl apply -f gateway/k8s/rbac.yaml
          kubectl apply -f gateway/k8s/deployment.yaml
          kubectl apply -f gateway/k8s/service.yaml
          kubectl apply -f builder/k8s/sa.yaml
          kubectl apply -f builder/k8s/deployment.yaml
          kubectl apply -f realtime/k8s/deployment.yaml
          kubectl apply -f realtime/k8s/service.yaml
          kubectl apply -f email/k8s/deployment.yaml
          kubectl apply -f analytics/k8s/deployment.yaml
          kubectl apply -f analytics/k8s/service.yaml

      - name: Deploy validator to Cloud Run
        run: |
          gcloud run deploy bifrost-validator \
            --image=europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/validator:latest \
            --region=europe-central2 \
            --project=bifrost-platform \
            --port=8090 \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=256Mi \
            --cpu=1

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/bifrost-rabbitmq -n bifrost-apps
          kubectl rollout restart deployment/bifrost-gateway -n bifrost-apps
          kubectl rollout restart deployment/bifrost-builder -n bifrost-apps
          kubectl rollout restart deployment/bifrost-realtime -n bifrost-apps
          kubectl rollout restart deployment/bifrost-email -n bifrost-apps
          kubectl rollout restart deployment/bifrost-analytics -n bifrost-apps

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/bifrost-rabbitmq -n bifrost-apps --timeout=600s
          kubectl rollout status deployment/bifrost-gateway -n bifrost-apps --timeout=180s
          kubectl rollout status deployment/bifrost-builder -n bifrost-apps --timeout=180s
          kubectl rollout status deployment/bifrost-realtime -n bifrost-apps --timeout=180s
          kubectl rollout status deployment/bifrost-email -n bifrost-apps --timeout=180s
          kubectl rollout status deployment/bifrost-analytics -n bifrost-apps --timeout=180s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n bifrost-apps
          echo "=== Services ==="
          kubectl get svc -n bifrost-apps
