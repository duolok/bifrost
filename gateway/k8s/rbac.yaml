apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bifrost-deployer
  namespace: bifrost-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bifrost-gateway-deployer
  namespace: bifrost-apps
subjects:
  - kind: ServiceAccount
    name: bifrost-gateway
    namespace: bifrost-apps
roleRef:
  kind: Role
  name: bifrost-deployer
  apiGroup: rbac.authorization.k8s.io
