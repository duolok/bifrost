apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-gateway
  namespace: bifrost-apps
  labels:
    app: bifrost-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bifrost-gateway
  template:
    metadata:
      labels:
        app: bifrost-gateway
    spec:
      serviceAccountName: bifrost-gateway
      containers:
        - name: gateway
          image: europe-central2-docker.pkg.dev/bifrost-platform/bifrost-platform/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: BF_PORT
              value: "8080"
            - name: BF_ENV
              value: "prod"
            - name: BF_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: database_url
            - name: BF_GCP_PROJECT
              value: "bifrost-platform"
            - name: BF_AR_REPO
              value: "europe-central2-docker.pkg.dev/bifrost-platform/bifrost-apps"
            - name: BF_K8S_IN_CLUSTER
              value: "true"
            - name: BF_K8S_NAMESPACE
              value: "bifrost-apps"
            - name: BF_VALIDATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: validator_url
            - name: BF_REALTIME_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: realtime_url
            - name: BF_RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: rabbitmq_url
            - name: BF_AUTH_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: auth_callback_url
            - name: BF_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bifrost-oauth
                  key: google-client-id
            - name: BF_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bifrost-oauth
                  key: google-client-secret
            - name: BF_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bifrost-oauth
                  key: github-client-id
            - name: BF_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bifrost-oauth
                  key: github-client-secret
            - name: BF_UI_URL
              valueFrom:
                configMapKeyRef:
                  name: bifrost-config
                  key: ui_url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
