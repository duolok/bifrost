# cloudbuild.yaml
#
# Triggers on push to main. Runs tests, builds container, deploys to Cloud Run.
# Region: europe-central2 

steps:
  # Run Go tests
  - name: 'golang:1.25'
    dir: 'gateway'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go test -short -race -count=1 ./...

  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest'
      - 'gateway/'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bifrost-gateway'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--set-env-vars'
      - 'BF_ENV=prod,BF_K8S_IN_CLUSTER=false,BF_GCP_PROJECT=$PROJECT_ID,BF_AR_REPO=${_REGION}-docker.pkg.dev/$PROJECT_ID/bifrost-apps'
      - '--add-cloudsql-instances'
      - '${_DB_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'BF_DATABASE_URL=host=/cloudsql/${_DB_CONNECTION_NAME} user=bifrost password=${_DB_PASSWORD} dbname=bifrost sslmode=disable'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300s'

substitutions:
  _REGION: europe-central2
  _REPO: bifrost-platform
  _DB_CONNECTION_NAME: ''  # Set via trigger: PROJECT_ID:europe-central2:bifrost-db
  _DB_PASSWORD: ''         # Set via trigger or Secret Manager

options:
  logging: CLOUD_LOGGING_ONLY
