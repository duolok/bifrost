apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-rabbitmq
  namespace: bifrost-apps
  labels:
    app: bifrost-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bifrost-rabbitmq
  template:
    metadata:
      labels:
        app: bifrost-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-alpine
          ports:
            - containerPort: 5672
              name: amqp
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "bifrost"
            - name: RABBITMQ_DEFAULT_PASS
              value: "localdev"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 240
            periodSeconds: 30
